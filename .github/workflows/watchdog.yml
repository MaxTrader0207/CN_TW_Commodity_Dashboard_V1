name: Watchdog

# 停擺監控：超過 30 小時沒有成功更新（且有交易日排程被錯過）就開 Issue 通知，恢復後自動關閉。
# 觸發來源互為備援：Cloudflare Worker 每 4 小時（見 worker/trigger-worker.js）、GitHub 每 6 小時排程、手動。
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Restore data branch
        run: python pipeline/datastore.py restore
      - name: Check freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/watchdog.py
