name: Calibrate weights

on:
  schedule:
    # 台北時間 每週六 10:20：補抓類股指數、重算實測權重與回測
    - cron: "20 2 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Restore data branch
        run: python pipeline/datastore.py restore
      - name: Calibrate
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          mkdir -p docs/data
          python pipeline/calibrate.py 2>&1 | tee docs/data/calibrate_log.txt
      - name: Backup results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calibration-${{ github.run_id }}
          path: |
            docs/data/calibration.json
            docs/data/calibrate_log.txt
            pipeline/cache
          if-no-files-found: ignore
          retention-days: 14
      - name: Save to data branch
        if: always()
        run: |
          python pipeline/datastore.py save "calibrate: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"

  deploy:
    needs: calibrate
    if: always()
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
