name: Calibrate weights

on:
  schedule:
    # 台北時間 每週六 10:20：補抓類股指數、重算實測權重與回測
    - cron: "20 2 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Calibrate
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          mkdir -p docs/data
          python pipeline/calibrate.py 2>&1 | tee docs/data/calibrate_log.txt
      - name: Backup results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-${{ github.run_id }}
          path: |
            docs/data/calibration.json
            docs/data/calibrate_log.txt
            pipeline/cache
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data pipeline/cache
          git diff --cached --quiet || git commit -m "calibrate: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            if out=$( { git pull --rebase -X theirs origin main && git push; } 2>&1 ); then echo "$out"; exit 0; fi
            echo "$out"
            git rebase --abort 2>/dev/null || true
            echo "push 失敗，第 $i 次重試"; sleep $((i * 5))
          done
          echo "::error title=commit push::$(echo "$out" | tail -6 | tr '\n' ' ')"
          exit 1
