name: Calibrate weights

on:
  schedule:
    # 台北時間 每週六 10:20：補抓類股指數、重算實測權重與回測
    - cron: "20 2 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Restore data branch
        run: python pipeline/datastore.py restore
      - name: Calibrate
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          mkdir -p docs/data
          python pipeline/calibrate.py 2>&1 | tee docs/data/calibrate_log.txt
      - name: Backup results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calibration-${{ github.run_id }}
          path: |
            docs/data/calibration.json
            docs/data/calibrate_log.txt
            pipeline/cache
          if-no-files-found: ignore
          retention-days: 14
      - name: Save to data branch
        if: always()
        run: |
          python pipeline/datastore.py save "calibrate: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"

  deploy:
    needs: calibrate
    if: always()
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
