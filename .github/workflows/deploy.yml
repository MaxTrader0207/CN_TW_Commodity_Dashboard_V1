name: Deploy pages

# 網站 = main 的 docs/（程式）＋ data 分支的 docs/data（資料），由 Actions 組合後部署到 GitHub Pages。
# 改程式（push main）、每日更新、每週校準完成後都會觸發。
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Restore data branch
        run: python pipeline/datastore.py restore
      - name: Check site
        run: |
          test -f docs/index.html
          test -f docs/data/latest.json || echo "::warning title=資料::docs/data/latest.json 不存在（data 分支尚無資料）"
          rm -f docs/data/calibration_detail.json docs/data/calibrate_log.txt   # 研究用的完整紀錄不放上網站
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      # 部署步驟偶爾會因 GitHub 端暫時性錯誤失敗（資料其實已更新）：失敗時等 45 秒再試一次，第二次也失敗才算失敗
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
