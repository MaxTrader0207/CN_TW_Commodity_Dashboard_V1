name: Daily update

on:
  schedule:
    # 台北時間 週一~週五 17:10（陸期日盤 15:00 收盤、證交所 OpenAPI 當日資料已更新）
    - cron: "10 9 * * 1-5"
    # 台北時間 週二~週六 08:10（陸期夜盤收盤後，台股開盤前）
    - cron: "10 0 * * 2-6"
  workflow_dispatch:
    inputs:
      session:
        description: "auto = 依時間判斷, day = 日盤收盤版, night = 夜盤盤前版"
        type: choice
        options: [auto, day, night]
        default: auto

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build data
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 輸入值只經環境變數傳入，不直接嵌進 shell 指令，避免指令注入
          IN_SESSION: ${{ github.event.inputs.session }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -o pipefail
          mkdir -p docs/data
          {
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$IN_SESSION" in
              day|night) python pipeline/build.py --session "$IN_SESSION" ;;
              *) python pipeline/build.py ;;
            esac
          elif [ "$SCHEDULE" = "10 0 * * 2-6" ]; then
            # GitHub 排程可能延遲數小時；過了台股開盤（09:00）就不再算「盤前」，跳過以免覆蓋準時的訊號
            if [ "$(TZ=Asia/Taipei date +%H)" -ge 9 ]; then
              echo "夜盤版排程延遲到 $(TZ=Asia/Taipei date +%H:%M)，已過台股開盤，略過"
            else
              python pipeline/build.py --session night
            fi
          else
            python pipeline/build.py --session day
          fi
          } 2>&1 | tee docs/data/run_log.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data pipeline
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "push 失敗，第 $i 次重試"; sleep $((i * 5))
          done
          exit 1
