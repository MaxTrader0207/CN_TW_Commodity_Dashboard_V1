name: Daily update

on:
  schedule:
    # 台北時間 週一~週五 17:10（陸期日盤 15:00 收盤、證交所 OpenAPI 當日資料已更新）
    - cron: "10 9 * * 1-5"
    # 台北時間 週二~週六 盤前版：06:17／06:47／07:13／07:41／08:07 多次嘗試（GitHub 排程常延遲），
    # 第一個準時完成的生效，之後的自動略過；06:17 起跑確保美盤已收盤（夏令 05:00、冬令 06:00 台北時間）
    - cron: "17 22 * * 1-5"
    - cron: "47 22 * * 1-5"
    - cron: "13 23 * * 1-5"
    - cron: "41 23 * * 1-5"
    - cron: "7 0 * * 2-6"
  workflow_dispatch:
    inputs:
      session:
        description: "auto = 依時間判斷, day = 日盤收盤版, night = 夜盤盤前版, night-once = 盤前版（今天已完成或已過 09:00 則略過；Cloudflare 定時觸發用）"
        type: choice
        options: [auto, day, night, night-once]
        default: auto

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Restore data branch
        run: python pipeline/datastore.py restore
      - name: Build data
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 輸入值只經環境變數傳入，不直接嵌進 shell 指令，避免指令注入
          IN_SESSION: ${{ github.event.inputs.session }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -o pipefail
          mkdir -p docs/data
          {
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$IN_SESSION" in
              day|night) python pipeline/build.py --session "$IN_SESSION" ;;
              night-once)
                if [ "$(TZ=Asia/Taipei date +%-H)" -ge 9 ]; then echo "已過台股開盤（09:00），盤前版略過"
                else python pipeline/build.py --session night --skip-if-done; fi ;;
              *) python pipeline/build.py ;;
            esac
          elif [ "$SCHEDULE" != "10 9 * * 1-5" ]; then
            # 盤前版：GitHub 排程可能延遲數小時；過了台股開盤（09:00）就不再算「盤前」，跳過以免覆蓋準時的訊號
            if [ "$(TZ=Asia/Taipei date +%-H)" -ge 9 ]; then
              echo "盤前版排程延遲到 $(TZ=Asia/Taipei date +%H:%M)，已過台股開盤，略過"
            else
              python pipeline/build.py --session night --skip-if-done
            fi
          else
            python pipeline/build.py --session day
          fi
          } 2>&1 | tee docs/data/run_log.txt
      - name: Save to data branch
        if: always()
        run: |
          python pipeline/datastore.py save "data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"

  deploy:
    needs: build
    if: always()
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
