name: Daily update

on:
  schedule:
    # 主要由 Cloudflare Worker 定時觸發（06:17、07:07 盤前版；17:10 收盤版）。GitHub 自己的排程常延遲數小時，
    # 只各留一條當備援：今天已有準時的版本、或已經過了該版本的時段，就會略過（不更新、不部署）
    - cron: "10 9 * * 1-5"      # 台北 17:10 收盤版備援
    - cron: "47 22 * * 0-4"     # 台北 06:47 盤前版備援
  workflow_dispatch:
    inputs:
      session:
        description: "auto = 依時間判斷, day = 日盤收盤版, night = 夜盤盤前版, night-once = 盤前版（今天已完成或已過 09:00 則略過；Cloudflare 定時觸發用）"
        type: choice
        options: [auto, day, night, night-once]
        default: auto

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.build.outputs.updated }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Restore data branch
        run: python pipeline/datastore.py restore
      - name: Build data
        id: build
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 輸入值只經環境變數傳入，不直接嵌進 shell 指令，避免指令注入
          IN_SESSION: ${{ github.event.inputs.session }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -o pipefail
          mkdir -p docs/data
          stamp() { python -c "import json;print(json.load(open('docs/data/latest.json'))['generated_at'])" 2>/dev/null || echo none; }
          before=$(stamp)
          {
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$IN_SESSION" in
              day|night) python pipeline/build.py --session "$IN_SESSION" ;;
              night-once)
                if [ "$(TZ=Asia/Taipei date +%-H)" -ge 9 ]; then echo "已過台股開盤（09:00），盤前版略過"
                else python pipeline/build.py --session night --skip-if-done; fi ;;
              *) python pipeline/build.py ;;
            esac
          elif [ "$SCHEDULE" != "10 9 * * 1-5" ]; then
            # 盤前版：GitHub 排程可能延遲數小時；過了台股開盤（09:00）就不再算「盤前」，跳過以免覆蓋準時的訊號
            if [ "$(TZ=Asia/Taipei date +%-H)" -ge 9 ]; then
              echo "盤前版排程延遲到 $(TZ=Asia/Taipei date +%H:%M)，已過台股開盤，略過"
            else
              python pipeline/build.py --session night --skip-if-done
            fi
          else
            # 收盤版備援排程（主要由 Cloudflare 17:10 觸發）：GitHub 排程曾延遲到隔天凌晨才跑，
            # 不在 15:00~23:59（週一~五）就略過；今天已有準時的收盤版也略過
            h=$(TZ=Asia/Taipei date +%-H); wd=$(TZ=Asia/Taipei date +%u)
            if [ "$h" -lt 15 ] || [ "$wd" -gt 5 ]; then
              echo "收盤版排程延遲到 $(TZ=Asia/Taipei date '+%m-%d %H:%M')，已不在收盤後時段，略過"
            else
              python pipeline/build.py --session day --skip-if-done
            fi
          fi
          } 2>&1 | tee docs/data/run_log.txt
          # 這次有沒有真的產生新資料（略過時不存檔、不部署，避免多餘的網站部署）
          if [ "$(stamp)" != "$before" ]; then echo "updated=true" >> "$GITHUB_OUTPUT"; else echo "updated=false" >> "$GITHUB_OUTPUT"; echo "這次沒有產生新資料，不存檔、不部署"; fi
      - name: Save to data branch
        # 有新資料才存；執行失敗時也存（把失敗狀態寫進 status.json 給頁面顯示）
        if: always() && steps.build.outputs.updated != 'false'
        run: |
          python pipeline/datastore.py save "data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"

  deploy:
    needs: build
    if: needs.build.outputs.updated == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
